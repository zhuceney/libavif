name: Build libavif All Encoders (Windows Static)

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Visual Studio shell
        uses: egor-tensin/vs-shell@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1
        with:
          version: 2.15.05

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Install Meson
        run: pip install meson

      # 只缓存构建产物，避免污染源码和 patch
      - name: Cache ext dependencies
        id: cache-ext
        uses: actions/cache@v4
        with:
          path: |
            ext/*/build
            ext/*/install
          key: windows-ext-${{ runner.os }}-${{ hashFiles(
            'ext/*.cmd',
            'ext/*.sh',
            'ext/*.patch'
          ) }}

      - name: Build aom
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./aom.cmd

      - name: Build dav1d
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./dav1d.cmd

      - name: Build rav1e
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./rav1e.cmd

      - name: Build SVT-AV1
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./svt.cmd

      - name: Build libyuv
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./libyuv.cmd
        env:
          CC: clang-cl
          CXX: clang-cl

      - name: Build libsharpyuv
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./libsharpyuv.cmd

      - name: Build libjpeg
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./libjpeg.cmd

      - name: Build zlib and libpng
        if: steps.cache-ext.outputs.cache-hit != 'true'
        working-directory: ./ext
        run: ./zlibpng.cmd

      - name: Configure libavif
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DAVIF_CODEC_AOM=LOCAL
          -DAVIF_CODEC_DAV1D=LOCAL
          -DAVIF_CODEC_RAV1E=LOCAL
          -DAVIF_CODEC_SVT=LOCAL
          -DAVIF_LIBYUV=LOCAL
          -DAVIF_LIBSHARPYUV=LOCAL
          -DAVIF_JPEG=LOCAL
          -DAVIF_ZLIBPNG=LOCAL
          -DAVIF_BUILD_APPS=ON
          -DAVIF_BUILD_EXAMPLES=OFF
          -DAVIF_BUILD_TESTS=OFF

      - name: Build libavif
        run: cmake --build build --config Release --parallel 4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libavif-all-encoders-windows
          path: |
            build/avifenc.exe
            build/avifdec.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/avifenc.exe
            build/avifdec.exe
